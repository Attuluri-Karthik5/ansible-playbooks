---
- name: Implementing handlers
  hosts: all
  become: yes

  tasks:
    - name: Install apache2
      apt:
        name: apache2
        state: present
        update_cache: yes
      notify: Restart apache2

    - name: Edit the index.html file
      copy:
        content: "IntelliQ"
        dest: /var/www/html/index.html
      notify: Restart apache2

  handlers:
    - name: Restart apache2
      service:
        name: apache2
        state: restarted

    - name: check apache response
      uri:
        url: "{{ item }}"
        status_code: 200
      loop:
        - http://172.31.24.64
        - http://172.31.21.159


